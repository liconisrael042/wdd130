<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <meta name="description" content="This page provides our contact information so you can reach to us">
    <meta name="author" content="Israel Licon">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Rafting site Logo" width="150">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>El Rapids Rafting Company</h1>
            <h2>123 Main River Street</h2>
            <h2>Kolob, California</h2>
            <h2>+1 999 999 9999</h2>
            <h2>info@elrapidsrafting.com</h2>
        </div>

        <div class="information">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d22558.016224094856!2d15.615415174876873!3d78.22127233074767!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x45c564773a53ff91%3A0xd18c8f52f6f4fb3e!2sRadisson%20Blu%20Polar%20Hotel%2C%20Spitsbergen!5e0!3m2!1ses!2sbo!4v1795832744474!5m2!1ses!2sbo" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <div class="input">
                <form>
                    <div class="form-row">
                        <label for="username">Name:</label>
                        <input type="text" id="username" name="username">
                    </div>
                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                </form>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="form-column">
                        <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" name="purpose" value="sugestion"> Website Sugestion</label>
                    </div>
                </fieldset>

                <form>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4"></textarea>

                    <label><input type="checkbox" id="newsletter" name="newsletter"> Please Subscribe me to the monthly newsletter</label>

                    <button type="submit">Get in touch!</button>
                </form>
            </div>
        </div>
        <section class="employee">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/alyx.jpg" alt="Image of Alyx smiling" width="200">
                    <figcaption>"Trip Coordinator"</figcaption>
                </figure>
                <figure>
                    <img src="images/barney.jpg" alt="Image of Barney" width="200">
                    <figcaption>"Operations & Booking Manager"</figcaption>
                </figure>
                <figure>
                    <img src="images/gordon.jpg" alt=" river going through between mountains" width="200">
                    <figcaption>"Lead Guide"</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©️2026 ⭐⭐ Rafting Company ⭐⭐ Israel Licon </p>
        <nav class="socialmedia">
            <a href="https://instagram.com"> <img src="images/instagram.png" alt="Instagram logo" width="50"></a>
            <a href="https://linkedin.com"> <img src="images/linkedin.png" alt="Linkedin logo" width="50"></a>
            <a href="https://youtube.com"> <img src="images/youtube.png" alt="Search logo" width="50"></a>
        </nav>
    </footer>
</body>

</html>
